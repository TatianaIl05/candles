stages:
  - build
  - test
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release

build_app:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    
    # Build with no cache to ensure fresh build
    - docker build --no-cache -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    
    # Debug: Inspect the image contents
    - echo "=== Checking image contents ==="
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG ls -la / 2>&1 || echo "Failed to list root"
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG ls -la /app 2>&1 || echo "No /app directory"
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG find / -name "testproj" 2>&1 || echo "testproj not found"
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG which gcc 2>&1 || echo "gcc not found"
    
    # Build web image
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

test_app:
  stage: test
  image: $APP_IMAGE:$CI_COMMIT_TAG
  script:
    - echo "Current working directory:"
    - pwd
    - echo "List root directory:"
    - ls -la /
    - echo "List home directory:"
    - ls -la /home
    - echo "List app directory if exists:"
    - ls -la /app 2>/dev/null || echo "/app not found"
    - echo "Find testproj binary anywhere:"
    - find / -name "testproj" -type f 2>/dev/null || echo "testproj not found"
    - echo "Check if we're in the right image:"
    - cat /etc/os-release
  only:
    - tags

publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  script:
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_PATH_SLUG.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:1.23
  script:
    - echo "$KUBE_CONFIG" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - helm upgrade --install $HELM_RELEASE_NAME helm/test-repo-chart --set app.tag=$CI_COMMIT_TAG,web.tag=$CI_COMMIT_TAG
  only:
    - tags

pages:
  stage: pages
  image: $WEB_IMAGE:$CI_COMMIT_TAG
  script:
    - mkdir -p public
    - /entrypoint.sh > public/index.html
  artifacts:
    paths:
      - public
  only:
    - tags