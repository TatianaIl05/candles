stages:
  - test

test_vars:
  stage: test
  tags:
    - docker
  script:
    - echo "Username: $DOCKERHUB_USERNAME"
    - echo "Password exists: $(test -n "$DOCKERHUB_PASSWORD" && echo yes || echo no)"
    - docker --version
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin