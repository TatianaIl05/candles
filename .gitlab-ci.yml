stages:
  - build
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release

build_app:
  stage: build
  tags:
    - docker
  services:
    - docker:dind
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
    - docker build -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

publish_images:
  stage: publish
  tags:
    - docker
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

publish_helm:
  stage: pages
  tags:
    - docker
  script:
    - apk add --no-cache curl
    - curl -LO "https://get.helm.sh/helm-v3.10.0-linux-amd64.tar.gz"
    - tar -xzf helm-v3.10.0-linux-amd64.tar.gz
    - mv linux-amd64/helm /usr/local/bin/
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_ROOT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

deploy_k8s:
  stage: deploy
  tags:
    - docker
  script:
    - apk add --no-cache curl
    - curl -LO "https://get.helm.sh/helm-v3.10.0-linux-amd64.tar.gz"
    - tar -xzf helm-v3.10.0-linux-amd64.tar.gz
    - mv linux-amd64/helm /usr/local/bin/
    - mkdir -p /root/.kube
    - echo "$KUBE_CONFIG" | base64 -d > /root/.kube/config
    - helm upgrade --install $HELM_RELEASE_NAME helm/test-repo-chart --set app.image=$APP_IMAGE:$CI_COMMIT_TAG --set web.image=$WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

pages:
  stage: pages
  tags:
    - docker
  script:
    - mkdir -p public
    - echo "<html><body><h1>Test Results</h1><pre>" > public/index.html
    - docker run --rm $WEB_IMAGE:$CI_COMMIT_TAG /entrypoint.sh >> public/index.html
    - echo "</pre></body></html>" >> public/index.html
  artifacts:
    paths:
      - public
  only:
    - tags