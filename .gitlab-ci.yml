stages:
  - build
  - test
  - publish
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  # Standard DinD configuration
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"

build_app:
  stage: build
  image: docker:20.10
  services:
    - docker:20.10-dind
  tags:
    - docker
  before_script:
    - mkdir -p $DOCKER_CERT_PATH
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker build --no-cache -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

test_app:
  stage: test
  tags:
    - docker
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG /app/build/testproj
  only:
    - tags
  needs:
    - build_app

publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:20.10-dind
  tags:
    - docker
  before_script:
    - mkdir -p $DOCKER_CERT_PATH
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags
  needs:
    - build_app

publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  tags:
    - docker
  script:
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_PATH_SLUG.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

pages:
  stage: pages
  tags:
    - docker
  image: docker:20.10
  services:
    - docker:20.10-dind
  before_script:
    - mkdir -p $DOCKER_CERT_PATH
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - mkdir -p public
    
    # Create HTML page with test results
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Results - $CI_COMMIT_TAG</title>
        <style>
          body { font-family: monospace; margin: 20px; }
          pre { background: #f0f0f0; padding: 10px; border-radius: 5px; }
          .success { color: green; }
        </style>
      </head>
      <body>
        <h1>Build Results</h1>
        <p><strong>Version:</strong> $CI_COMMIT_TAG</p>
        <p><strong>Pipeline:</strong> $CI_PIPELINE_ID</p>
        <p><strong>Time:</strong> $(date)</p>
        <h2>Test Output:</h2>
        <pre>
      EOF
    
    # Run the test and capture output
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG /app/build/testproj 2>&1 | tee -a public/index.html
    
    # Close HTML
    - |
      cat >> public/index.html << 'EOF'
        </pre>
        <p class="success">✅ Pipeline completed successfully</p>
      </body>
      </html>
      EOF
    
    - echo "Pages generated at public/index.html"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: never
  only:
    - tags
  needs:
    - test_app