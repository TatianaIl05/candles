stages:
  - build
  - test
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release

# 1. Сборка образов
build_app:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  tags:
    - docker
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:dind
  tags:
    - docker
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 2. Запуск тестов
test_app:
  stage: test
  image: $APP_IMAGE:$CI_COMMIT_TAG
  tags:                           # ← ДОБАВИТЬ
    - docker                      # ← ДОБАВИТЬ
  script:
    - /app/build/testproj
  only:
    - tags

# 3. Публикация образов
publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:dind
  tags:                           # ← ДОБАВИТЬ
    - docker                      # ← ДОБАВИТЬ
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 4. Публикация Helm-чарта
publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  tags:                           # ← ДОБАВИТЬ
    - docker                      # ← ДОБАВИТЬ
  script:
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_ROOT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

# 5. Деплой в Kubernetes
deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:1.23
  tags:                           # ← ДОБАВИТЬ
    - docker                      # ← ДОБАВИТЬ
  script:
    - echo "$KUBE_CONFIG" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - helm upgrade --install $HELM_RELEASE_NAME helm/test-repo-chart \
        --set app.image=$APP_IMAGE:$CI_COMMIT_TAG \
        --set web.image=$WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 6. Публикация результатов тестов
pages:
  stage: pages
  image: $WEB_IMAGE:$CI_COMMIT_TAG
  tags:                           # ← ДОБАВИТЬ
    - docker                      # ← ДОБАВИТЬ
  script:
    - mkdir -p public
    - /entrypoint.sh > public/index.html
  artifacts:
    paths:
      - public
  only:
    - tags