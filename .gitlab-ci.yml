stages:
  - build
  - test
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release

build_app:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker build -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

test_app:
  stage: test
  image: $APP_IMAGE:latest
  script:
    - ls -la /build/
    - /build/testproj 
  only:
    - tags

publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  script:
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_PATH_SLUG.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:1.23
  script:
    - echo "$KUBE_CONFIG" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - helm upgrade --install $HELM_RELEASE_NAME helm/test-repo-chart --set app.tag=$CI_COMMIT_TAG,web.tag=$CI_COMMIT_TAG
  only:
    - tags

pages:
  stage: pages
  image: $WEB_IMAGE:$CI_COMMIT_TAG
  script:
    - mkdir -p public
    - /entrypoint.sh > public/index.html
  artifacts:
    paths:
      - public
  only:
    - tags