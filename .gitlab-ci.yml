stages:
  - build
  - test
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release
  # Disable TLS for Docker-in-Docker
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_TLS_VERIFY: 0

build_app:
  stage: build
  image: docker:20.10
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: 0
  tags:
    - docker
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker build --no-cache -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

test_app:
  stage: test
  tags:
    - docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: 0
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker pull $APP_IMAGE:$CI_COMMIT_TAG
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG /app/build/testproj
  only:
    - tags

publish_images:
  stage: publish
  image: docker:20.10
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: 0
  tags:
    - docker
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  tags:
    - docker
  script:
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    - mkdir -p public/helm
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    - helm repo index public/helm --url https://$CI_PROJECT_PATH_SLUG.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:1.23
  tags:
    - docker
  script:
    - echo "$KUBE_CONFIG" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - helm repo add test-repo https://$CI_PROJECT_PATH_SLUG.gitlab.io/$CI_PROJECT_NAME/helm || true
    - helm upgrade --install $HELM_RELEASE_NAME test-repo/test-repo-chart --set app.tag=$CI_COMMIT_TAG,web.tag=$CI_COMMIT_TAG
  only:
    - tags

pages:
  stage: pages
  tags:
    - docker
  image: docker:20.10
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: 0
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker pull $APP_IMAGE:$CI_COMMIT_TAG
    
    - mkdir -p public
    
    - |
      cat > public/index.html << HTML
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Results - $CI_COMMIT_TAG</title>
        <style>
          body { font-family: Arial, sans-serif; margin: 40px; }
          pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
          .header { background: #2c3e50; color: white; padding: 20px; border-radius: 5px; }
        </style>
      </head>
      <body>
        <div class="header">
          <h1>Build Results</h1>
        </div>
        <p><strong>Version:</strong> $CI_COMMIT_TAG</p>
        <p><strong>Pipeline:</strong> $CI_PIPELINE_ID</p>
        <p><strong>Build Time:</strong> $(date)</p>
        <h2>Test Output:</h2>
        <pre>
      HTML
    
    - docker run --rm $APP_IMAGE:$CI_COMMIT_TAG /app/build/testproj 2>&1 | tee -a public/index.html
    
    - |
      cat >> public/index.html << HTML
        </pre>
        <hr>
        <p><small>Generated by GitLab CI/CD</small></p>
      </body>
      </html>
      HTML
    
    - echo "Pages generated successfully"
  artifacts:
    paths:
      - public
    expire_in: never
  only:
    - tags
  needs:
    - test_app