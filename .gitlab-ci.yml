stages:
  - build
  - test
  - publish
  - deploy
  - pages

variables:
  APP_IMAGE: $DOCKERHUB_USERNAME/repo-app
  WEB_IMAGE: $DOCKERHUB_USERNAME/repo-web
  HELM_RELEASE_NAME: test-release

# 1. Сборка образов
build_app:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker build -t $APP_IMAGE:$CI_COMMIT_TAG -f Dockerfile.app .
    - docker build -t $WEB_IMAGE:$CI_COMMIT_TAG -f Dockerfile.web .
  only:
    - tags

# 2. Запуск тестов (временный контейнер)
test_app:
  stage: test
  image: $APP_IMAGE:$CI_COMMIT_TAG
  script:
    - /app/build/testproj   # путь к вашим тестам
  only:
    - tags

# 3. Публикация образов на Docker Hub
publish_images:
  stage: publish
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker push $APP_IMAGE:$CI_COMMIT_TAG
    - docker push $WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 4. Публикация Helm-чарта в GitLab Pages (как Helm-репозиторий)
publish_helm:
  stage: pages
  image: alpine/helm:3.10.0
  script:
    # Упаковать чарт с версией = тегу
    - helm package helm/test-repo-chart --version $CI_COMMIT_TAG
    # Создать директорию для Pages
    - mkdir -p public/helm
    # Переместить чарт
    - mv test-repo-chart-$CI_COMMIT_TAG.tgz public/helm/
    # Создать index.yaml (индекс Helm-репозитория)
    - helm repo index public/helm --url https://$CI_PROJECT_ROOT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/helm
  artifacts:
    paths:
      - public
  only:
    - tags

# 5. Деплой в Kubernetes
deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:1.23
  script:
    - echo "$KUBE_CONFIG" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - helm upgrade --install $HELM_RELEASE_NAME helm/test-repo-chart \
        --set app.image=$APP_IMAGE:$CI_COMMIT_TAG \
        --set web.image=$WEB_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 6. Публикация результатов тестов на GitLab Pages (статический сайт)
pages:
  stage: pages
  image: $WEB_IMAGE:$CI_COMMIT_TAG
  script:
    - mkdir -p public
    - /entrypoint.sh > public/index.html   # сохраняем вывод веб-сервера как HTML
  artifacts:
    paths:
      - public
  only:
    - tags