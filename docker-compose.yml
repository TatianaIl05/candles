version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: repo-app
    # Принудительно держим контейнер активным, чтобы web мог получить логи
    command: sh -c "./build/testproj && sleep infinity"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: repo-web
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock