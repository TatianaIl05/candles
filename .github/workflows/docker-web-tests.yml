name: Docker Build and Helm Package

on:
  push:
    branches:
      - feature/k8s-helm
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: tatianail05/repo-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: tatianail05/repo-web:latest

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Package Helm chart
        run: |
          helm package helm/test-repo-chart
          echo "CHART_FILE=$(ls *.tgz)" >> $GITHUB_ENV

      - name: Upload Helm chart to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.CHART_FILE }}
          tag_name: helm-chart-${{ github.run_number }}
          name: Helm Chart ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Опционально: деплой в тестовый кластер
      - name: Deploy to test cluster
        if: false  # Отключено, пока нет доступа к кластеру
        uses: azure/k8s-deploy@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          manifests: helm/test-repo-chart/templates/
